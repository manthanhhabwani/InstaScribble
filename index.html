<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InstaScribble</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="app-title">InstaScribble</h1>
      </div>
    </header>
    <main>
      <div class="container">
        <section class="notes-section">
          <h2>Notes</h2>
          <div class="notes-container">
            <article class="note-card">
              <header class="note-header">
                <h3>Title</h3>
                <time datetime="2026-07-27">27 july 2026</time>
              </header>
              <p>This is a preview of the note content...</p>
              <footer class="note-actions">
                <button type="button">Delete</button>
              </footer>
            </article>
          </div>
        </section>
        <section class="add-notes-section">
          <h2>Add a Note</h2>
          <form class="note-form">
            <label for="title">Title</label>
            <input id="title" type="text" name="title" />
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes"></textarea>
            <div class="form-actions"><button type="submit">Save</button></div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
